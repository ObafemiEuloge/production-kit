# Limitation de debit : protege la connexion du bourrage d'identifiants
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream app_backend {
    server app:3000;
    keepalive 32;
}

# Redirection HTTP vers HTTPS, sauf le challenge Let's Encrypt
server {
    listen 80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10M;
    limit_conn perip 20;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Endpoint d'authentification : quota strict
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    # WebSocket
    location /ws {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Blocage des chemins sensibles
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|sql|bak|log|ini)$ { deny all; }
}
